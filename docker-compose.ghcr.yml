# Same stack as docker-compose.yml, but it pulls the prebuilt image that CI publishes to the
# GitHub Container Registry instead of building on this machine.
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
# Or set COMPOSE_FILE=docker-compose.ghcr.yml in .env. For HTTPS add the Traefik overlay
# (COMPOSE_FILE=docker-compose.ghcr.yml:docker-compose.traefik.yml), see docs/deployment.md.
# The services below must keep the same settings as docker-compose.yml, CI checks that.

x-image: &image
  # IMAGE_TAG is `latest` (the last build of main) or `sha-<commit>` to pin or roll back.
  image: ${IMAGE:-ghcr.io/paralect/automation-server}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  init: true

services:
  server:
    <<: *image
    environment:
      PORT: 3000
      DATABASE_PATH: /data/automation.db
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN in .env}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      SENTRY_CLIENT_SECRET: ${SENTRY_CLIENT_SECRET:-}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
      SENTRY_API_BASE_URL: ${SENTRY_API_BASE_URL:-https://sentry.io}
      SENTRY_LEVELS: ${SENTRY_LEVELS:-error,fatal}
      SENTRY_ENVIRONMENTS: ${SENTRY_ENVIRONMENTS:-}
      SENTRY_MIN_EVENT_COUNT: ${SENTRY_MIN_EVENT_COUNT:-1}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_ACTIONS_REPOS: ${GITHUB_ACTIONS_REPOS:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-}
      SLACK_ALERTS_WEBHOOK_URL: ${SLACK_ALERTS_WEBHOOK_URL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
    volumes:
      - data:/data
    ports:
      # Sentry must reach /webhooks/sentry, so this port is public.
      - "${SERVER_PORT:-3000}:3000"

  admin:
    <<: *image
    working_dir: /app/apps/admin
    command: ["bun", "run", "serve.ts"]
    environment:
      PORT: 3001
      AUTOMATION_SERVER_URL: http://server:3000
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    depends_on:
      server:
        condition: service_healthy
    ports:
      # Loopback only. The session cookie is Secure and the login rate limit ignores
      # X-Forwarded-For unless TRUST_PROXY=true, so keep it off the internet without a proxy.
      # Reach it with `ssh -L 3001:127.0.0.1:3001 <vps>`, or use the Traefik overlay.
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"

volumes:
  data:
