# Optional overlay: Traefik in front of both services with Let's Encrypt certificates.
# Enable it with COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml in .env.
# Needs DNS A records for SERVER_DOMAIN and ADMIN_DOMAIN pointing at the VPS, and ports 80 and 443 open.

services:
  traefik:
    # v3.6 or newer: older releases cannot talk to Docker Engine 29.
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=automation-server_edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - edge

  server:
    ports: !reset []
    networks:
      - default
      - edge
    labels:
      - traefik.enable=true
      # Only the webhook endpoint and the health check are public. The admin API (/rpc)
      # stays on the internal network, where the admin reaches it as http://server:3000.
      - traefik.http.routers.server.rule=Host(`${SERVER_DOMAIN:?set SERVER_DOMAIN in .env}`) && (PathPrefix(`/webhooks/`) || Path(`/health`))
      - traefik.http.routers.server.entrypoints=websecure
      - traefik.http.services.server.loadbalancer.server.port=3000

  admin:
    ports: !reset []
    networks:
      - default
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=Host(`${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}`)
      - traefik.http.routers.admin.entrypoints=websecure
      - traefik.http.services.admin.loadbalancer.server.port=3001

networks:
  edge:
    name: automation-server_edge

volumes:
  letsencrypt:
