name: Codex issue fix

# Opens a draft PR with a Codex-written fix for each new issue, or for the
# issue named in a manual or server dispatch. Codex runs the fix-issue skill,
# which must exist in the repo at .agents/skills/fix-issue/ (copy it from
# github-actions/skills/fix-issue). See github-actions/README.md for setup.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Number of the issue to fix
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

# auth.json holds a refresh token that rotates on use, so two runs in parallel
# would invalidate each other. Runs queue behind the active one and never cancel
# it, but GitHub keeps only one pending run per group: a newer pending run
# replaces an older one. Rerun a dropped issue from the Actions tab.
concurrency:
  group: codex-auth
  cancel-in-progress: false

env:
  CODEX_VERSION: latest

jobs:
  fix:
    name: Fix issue with Codex
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Issue text is untrusted prompt input and this job holds Codex credentials,
    # so only people with write-ish access to the repo can trigger it. Only
    # they can dispatch, too. Issues labelled crisp are skipped on open because
    # automation-server dispatches the ones that passed its triage.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'crisp'))

    steps:
      - name: Require a private repository
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "::error::auth.json must never run in a public repository."
            exit 1
          fi

      # No stored credentials: the model can read the checkout, so the token
      # must not sit in .git/config. The PR step adds it back when it pushes.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # src/routeTree.gen.ts is gitignored; tsc needs it (same as ci.yml).
      - name: Generate route tree
        run: npm run generate-routes

      - name: Install Codex CLI
        run: npm install -g "@openai/codex@${CODEX_VERSION}"

      - name: Prepare Codex home
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          CODEX_REASONING_EFFORT: ${{ vars.CODEX_REASONING_EFFORT }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::Secret CODEX_AUTH_JSON is not set."
            exit 1
          fi
          home="$RUNNER_TEMP/codex-home"
          mkdir -p "$home"
          chmod 700 "$home"
          umask 077
          printf '%s' "$CODEX_AUTH_JSON" > "$home/auth.json"
          {
            echo 'cli_auth_credentials_store = "file"'
            echo 'approval_policy = "never"'
            printf 'model_reasoning_effort = "%s"\n' "${CODEX_REASONING_EFFORT:-high}"
            if [ -n "$CODEX_MODEL" ]; then
              printf 'model = "%s"\n' "$CODEX_MODEL"
            fi
          } > "$home/config.toml"
          echo "CODEX_HOME=$home" >> "$GITHUB_ENV"
          sha256sum "$home/auth.json" | cut -d' ' -f1 > "$RUNNER_TEMP/auth.sha256"

      # Values arrive through env, never interpolated into the script, so issue
      # text cannot inject shell.
      - name: Write issue file
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$ISSUE_NUMBER" in
              '' | *[!0-9]*) echo "::error::issue_number must be a number."; exit 1 ;;
            esac
            view() { gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json "$1" --jq "$2"; }
            ISSUE_TITLE=$(view title .title)
            ISSUE_AUTHOR=$(view author .author.login)
            ISSUE_LABELS=$(view labels '[.labels[].name] | join(", ")')
            ISSUE_BODY=$(view body .body)
          fi
          printf '%s' "$ISSUE_TITLE" > "$RUNNER_TEMP/issue-title.txt"
          printf '%s' "$ISSUE_NUMBER" > "$RUNNER_TEMP/issue-number.txt"
          {
            printf '# Issue #%s: %s\n\n' "$ISSUE_NUMBER" "$ISSUE_TITLE"
            printf 'Author: %s\n' "$ISSUE_AUTHOR"
            printf 'Labels: %s\n\n' "$ISSUE_LABELS"
            printf '%s\n' "$ISSUE_BODY"
          } > "$RUNNER_TEMP/issue.md"

      # No GH_TOKEN here on purpose: the model can edit the checkout but cannot
      # push or open PRs. The steps below do that.
      - name: Run Codex
        run: |
          codex exec \
            --sandbox workspace-write \
            --output-last-message "$RUNNER_TEMP/pr-body.md" \
            "Use \$fix-issue. The issue is at $RUNNER_TEMP/issue.md. Your final message becomes the PR body."

      - name: Open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ISSUE_NUMBER=$(cat "$RUNNER_TEMP/issue-number.txt")
          ISSUE_TITLE=$(cat "$RUNNER_TEMP/issue-title.txt")
          if [ -z "$(git status --porcelain)" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Codex ran but produced no change. See the run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 0
          fi
          if git status --porcelain -- .github | grep -q .; then
            gh issue comment "$ISSUE_NUMBER" --body "Codex changed files under .github, which this workflow refuses to push. See the run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi
          branch="codex/issue-$ISSUE_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git checkout -b "$branch"
          git add -A
          git commit -m "Fix issue #$ISSUE_NUMBER: $ISSUE_TITLE" -m "Refs #$ISSUE_NUMBER"
          git push --force-with-lease origin "$branch"
          {
            cat "$RUNNER_TEMP/pr-body.md" 2>/dev/null || true
            printf '\n\nRefs #%s\n' "$ISSUE_NUMBER"
          } > "$RUNNER_TEMP/pr-body-final.md"
          gh pr create --draft \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "$ISSUE_TITLE" \
            --body-file "$RUNNER_TEMP/pr-body-final.md"

      # Codex may have rotated the refresh token. Persist it even when an
      # earlier step failed, or the next run starts with a dead token.
      - name: Write back rotated auth.json
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRET_WRITE }}
        run: |
          [ -f "$RUNNER_TEMP/auth.sha256" ] || exit 0
          after=$(sha256sum "$CODEX_HOME/auth.json" | cut -d' ' -f1)
          [ "$after" != "$(cat "$RUNNER_TEMP/auth.sha256")" ] || exit 0
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::auth.json changed but GH_PAT_FOR_SECRET_WRITE is not set. Update CODEX_AUTH_JSON by hand or the next run may fail."
            exit 0
          fi
          gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < "$CODEX_HOME/auth.json"
